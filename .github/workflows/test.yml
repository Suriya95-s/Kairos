name: Kairos Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # bash on all three runners: the test step relies on shell glob expansion
    # (tests/*.test.js) and the line-count step uses POSIX tooling. Windows
    # runners default to PowerShell, which would break both.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Tests that execute Python skip themselves when no interpreter is found
      # (tests/helpers/python.js). Pin one so coverage is identical on all three
      # OSes instead of silently thinner on whichever runner lacks Python.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Check loop.js line count (target <1200 during v3 build)
        run: |
          LINES=$(wc -l < src/loop.js)
          echo "loop.js: $LINES lines"
          if [ "$LINES" -gt 1300 ]; then
            echo "::warning::loop.js has grown past 1300 lines ($LINES). Consider extracting more modules."
          fi
